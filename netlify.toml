[build]
  publish = "_site"
  command = "curl -LO https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.tar.gz && tar -xzf quarto-${QUARTO_VERSION}-linux-amd64.tar.gz -C $HOME && export PATH=$PATH:$HOME/quarto-${QUARTO_VERSION}/bin && quarto render"

[build.environment]
  QUARTO_VERSION = "1.10.18"
